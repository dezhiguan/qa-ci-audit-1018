kind: Agent
spec:
  auth:
    audience: qa-ci-audit-1018
  eval:
    dataset: qa-ci-audit-1018/seed
  kind: workflow
  audit:
    captureFields:
    - request_id
  tools:
  - name: ci.log.fetch
    risk: low
    access: read
    approval: none
  - name: git.pr.diff
    risk: low
    access: read
    approval: none
  - name: devflow.job.read
    risk: low
    access: read
    approval: none
  models:
    budget:
      dailyCny: 20.0
    default: qwen-plus
  prompts:
    items:
    - name: role
      type: text
    source: langfuse
  runtime:
    type: code
    endpoint: http://qa-ci-audit-1018.agents.svc.cluster.local:8000
    language: python
    liveness: k8s
  delegates: []
  knowledge: []
  guardrails:
    pii: mask
    grounding: 'off'
    inputInjection: enforce
metadata:
  name: qa-ci-audit-1018
  owner: 平台组 / 官德志
  displayName: CI证据审计员·新版底座验证
apiVersion: keel/v1
